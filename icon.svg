<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="购物价格记录">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45c084"/>
      <stop offset="0.55" stop-color="#2f9e63"/>
      <stop offset="1" stop-color="#1d7d4d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 满版背景（交给系统裁圆角，不要自己画圆角，否则会双圆角） -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="300" fill="url(#gloss)"/>

  <!-- 购物袋提手 -->
  <path d="M186 208 L186 168 A70 70 0 0 1 326 168 L326 208"
        fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 购物袋袋身 -->
  <rect x="136" y="204" width="240" height="196" rx="36" fill="#ffffff"/>

  <!-- 价格下降折线 + 末端圆点 -->
  <path d="M190 270 L238 308 L272 282 L320 328"
        fill="none" stroke="#2f9e63" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="328" r="15" fill="#2f9e63"/>
</svg>